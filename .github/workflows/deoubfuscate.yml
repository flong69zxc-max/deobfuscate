name: Deobfuscate JS

on:
  push:
    paths:
      - 'agent.js'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove binary header
        run: |
          tail -c +14 agent.js > extracted.js
          echo "Removed first 13 bytes, output to extracted.js"

      - name: Install webcrack
        run: npm install -g webcrack

      - name: Deobfuscate extracted JS
        run: webcrack extracted.js > deobfuscated.js

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-code
          path: deobfuscated.js
