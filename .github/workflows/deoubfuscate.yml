name: Extract VM Output

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run VM and capture
        run: |
          cat > extract.js << 'EOF'
          const fs = require('fs');
          const vm = require('vm');
          
          const code = fs.readFileSync('agent.js', 'utf8');
          
          const VHZh42 = code.match(/var VHZh42 = "([^"]+)"/)[1];
          
          const sandbox = {
            console: console,
            process: process,
            Buffer: Buffer,
            setTimeout: setTimeout,
            setInterval: setInterval,
            
            w7pcVa: function(seed, index, length) {
              let result = '';
              for (let i = 0; i < length; i++) {
                const key = ((seed ^ seed >>> 13) % 95 + 95) % 95;
                const enc = VHZh42.charCodeAt(index + i) - 32;
                const dec = ((enc - key) % 95 + 95) % 95;
                result += String.fromCharCode(dec + 32);
              }
              console.log('[STRING]', result);
              return result;
            },
            
            zQD7ADR: () => 0,
            yhIwiod: () => 0,
            bNou7B: () => [],
            kruj0XB: () => {},
            wEcR3bC: () => {}
          };
          
          vm.createContext(sandbox);
          
          try {
            vm.runInContext(code, sandbox, { timeout: 10000 });
          } catch(e) {
            console.log('Error:', e.message);
          }
          EOF
          
          node extract.js 2>&1 | tee output.log

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vm-output
          path: output.log
