name: Full Deobfuscation

on:
  push:
    paths:
      - 'agent.js'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deobfuscate
        run: |
          cat > deobfuscate.js << 'EOF'
          const fs = require('fs');
          const vm = require('vm');
          
          let code = fs.readFileSync('agent.js', 'utf8');
          
          // Извлекаем массив и строку из кода
          const arrayMatch = code.match(/var tj09YHa = \[([^\]]+)\]/);
          const stringMatch = code.match(/var VHZh42 = "([^"]+)"/);
          
          if (!arrayMatch || !stringMatch) {
            console.log('Could not find array or string');
            process.exit(1);
          }
          
          // Создаем контекст с перехватом
          const context = {
            console: console,
            process: process,
            Buffer: Buffer,
            setTimeout: setTimeout,
            setInterval: setInterval,
            // Заглушки для функций
            zQD7ADR: () => {},
            yhIwiod: () => {},
            bNou7B: () => {},
            kruj0XB: () => {},
            // Сам дешифратор
            w7pcVa: function(seed, index, length) {
              const result = this._w7pcVa(seed, index, length);
              console.log(`[DECRYPT] ${seed}, ${index}, ${length} => "${result}"`);
              return result;
            },
            _w7pcVa: function(seed, index, length) {
              let result = "";
              const VHZh42 = stringMatch[1];
              for (let i = 0; i < length; i++) {
                const key = ((seed ^ seed >>> 13) % 95 + 95) % 95;
                const enc = VHZh42.charCodeAt(index + i) - 32;
                const dec = ((enc - key) % 95 + 95) % 95;
                result += String.fromCharCode(dec + 32);
              }
              return result;
            }
          };
          
          vm.createContext(context);
          
          // Выполняем код в контексте
          try {
            vm.runInContext(code, context, { timeout: 10000 });
          } catch(e) {
            console.log('Execution error:', e.message);
          }
          EOF

      - name: Run deobfuscator
        run: node deobfuscate.js 2>&1 | tee decrypted.log

      - name: Extract and replace strings
        run: |
          node -e "
          const fs = require('fs');
          let code = fs.readFileSync('agent.js', 'utf8');
          
          // Извлекаем VHZh42
          const strMatch = code.match(/var VHZh42 = \"([^\"]+)\"/);
          const VHZh42 = strMatch ? strMatch[1] : '';
          
          function w7pcVa(seed, index, length) {
            let result = '';
            for (let i = 0; i < length; i++) {
              const key = ((seed ^ seed >>> 13) % 95 + 95) % 95;
              const enc = VHZh42.charCodeAt(index + i) - 32;
              const dec = ((enc - key) % 95 + 95) % 95;
              result += String.fromCharCode(dec + 32);
            }
            return result;
          }
          
          // Находим все вызовы w7pcVa
          const pattern = /w7pcVa\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/g;
          let match;
          while ((match = pattern.exec(code)) !== null) {
            const [_, seed, index, length] = match.map(Number);
            const result = w7pcVa(seed, index, length);
            const fullMatch = match[0];
            // Экранируем кавычки
            const escaped = result.replace(/\\\\/g, '\\\\\\\\').replace(/\"/g, '\\\\\"');
            code = code.replace(fullMatch, `\"${escaped}\"`);
          }
          
          fs.writeFileSync('deobfuscated.js', code);
          console.log('Replaced all w7pcVa calls with decrypted strings');
          "

      - name: Final beautify
        run: |
          npm install -g js-beautify
          js-beautify deobfuscated.js > final.js 2>/dev/null || true
          if [ ! -s final.js ]; then
            cp deobfuscated.js final.js
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-code
          path: |
            final.js
            decrypted.log
