name: Deobfuscate JS

on:
  push:
    paths:
      - 'agent.js'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' 

      - name: Install webcrack
        run: npm install -g webcrack

      - name: Run deobfuscation
        run: webcrack agent.js > deobfuscated.js

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-code
          path: deobfuscated.js
