name: Deobfuscate JS

on:
  push:
    paths:
      - 'agent.js'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean binary garbage
        run: |
          python3 -c "
          with open('agent.js', 'rb') as f:
              data = f.read()
          
          start = 13
          
          end = len(data)
          for i in range(len(data) - 1, -1, -1):
              if data[i] == 0x7d:
                  end = i + 1
                  break
          
          clean = data[start:end]
          
          with open('cleaned.js', 'wb') as out:
              out.write(clean)
          
          print(f'Cleaned: {len(data)} -> {len(clean)} bytes')
          "

      - name: Install webcrack
        run: npm install -g webcrack

      - name: Run deobfuscation
        run: webcrack cleaned.js > deobfuscated.js

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-code
          path: deobfuscated.js
