name: Deobfuscate Custom VM

on:
  push:
    paths:
      - 'agent.js'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install de4js
        run: npm install -g de4js

      - name: Run de4js
        run: de4js -i agent.js -o de4js_output.js

      - name: Try to extract strings by execution
        run: |
          node -e "
          const fs = require('fs');
          const vm = require('vm');
          
          let code = fs.readFileSync('de4js_output.js', 'utf8');
          
          // Добавляем перехватчики в начало
          const wrapper = \`
          const originalConsole = console.log;
          const decrypted = {};
          
          // Перехватываем w7pcVa
          const original_w7pcVa = w7pcVa;
          w7pcVa = function(seed, idx, len) {
            const result = original_w7pcVa(seed, idx, len);
            if (result && result.length > 2) {
              console.log('DECRYPTED_STRING:', result);
              decrypted[idx] = result;
            }
            return result;
          };
          
          \` + code;
          
          try {
            vm.runInNewContext(wrapper, {
              console: console,
              process: process,
              Buffer: Buffer,
              setTimeout: setTimeout,
              setInterval: setInterval
            }, { timeout: 10000 });
          } catch(e) {
            console.log('Execution error:', e.message);
          }
          "

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-code
          path: |
            de4js_output.js
            extracted_strings.txt
