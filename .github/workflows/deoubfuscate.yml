name: Extract VM Output

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run VM and capture
        run: |
          cat > extract.js << 'EOF'
          const fs = require('fs');
          
          // Загружаем код
          const code = fs.readFileSync('agent.js', 'utf8');
          
          // Создаем перехватчик для wEcR3bC (главная функция VM)
          const originalCode = code.replace(
            /function wEcR3bC\([^)]*\)\s*\{\s*\}/,
            `function wEcR3bC(...args) {
              console.log('[VM_INSTR]', args.map(a => typeof a === 'function' ? '[Function]' : a).join(', '));
              return args[args.length - 1];
            }`
          );
          
          // Добавляем перехват результатов
          const wrapper = `
          const fs = require('fs');
          const vm = require('vm');
          
          const sandbox = {
            console: console,
            process: process,
            Buffer: Buffer,
            setTimeout: setTimeout,
            setInterval: setInterval,
            // Подменяем w7pcVa чтобы логировать расшифрованные строки
            w7pcVa: function(seed, index, length) {
              const VHZh42 = "${code.match(/var VHZh42 = "([^"]+)"/)[1]}";
              let result = '';
              for (let i = 0; i < length; i++) {
                const key = ((seed ^ seed >>> 13) % 95 + 95) % 95;
                const enc = VHZh42.charCodeAt(index + i) - 32;
                const dec = ((enc - key) % 95 + 95) % 95;
                result += String.fromCharCode(dec + 32);
              }
              console.log('[DECRYPT]', result);
              return result;
            },
            // Подменяем все функции, чтобы они логировали
            zQD7ADR: function(x) { return x; },
            yhIwiod: function(x) { return 0; },
            bNou7B: function(a,b) { return []; },
            kruj0XB: function(a,b,c,d) { 
              console.log('[VM_CALL]', a, b, c);
              return b; 
            }
          };
          
          vm.createContext(sandbox);
          
          try {
            const result = vm.runInContext(\`${originalCode}\`, sandbox, {
              timeout: 30000,
              displayErrors: true
            });
            console.log('Execution completed');
          } catch(e) {
            console.log('Error:', e.message);
          }
          `;
          
          fs.writeFileSync('run.js', wrapper);
          node run.js 2>&1 | tee output.log
          EOF

      - name: Run extraction
        run: node extract.js

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vm-output
          path: output.log
