name: Deobfuscate Custom VM

on:
  push:
    paths:
      - 'agent.js'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install de4js
        run: |
          npm install -g de4js
          which de4js || echo "de4js not found"

      - name: Run de4js
        run: |
          npx de4js -i agent.js -o de4js_output.js || echo "npx de4js failed"

      - name: Try manual extraction
        run: |
          node -e "
          const fs = require('fs');
          const vm = require('vm');
          
          const code = fs.readFileSync('agent.js', 'utf8');
          
          const sandbox = {
            console: {
              log: (...args) => {
                if (args[0] && typeof args[0] === 'string' && args[0].length > 3) {
                  console.log('[EXTRACT]', args[0]);
                }
              }
            },
            process: process,
            Buffer: Buffer,
            setTimeout: setTimeout,
            setInterval: setInterval
          };
          
          vm.createContext(sandbox);
          
          try {
            const result = vm.runInContext(code, sandbox, {
              timeout: 5000,
              displayErrors: true
            });
            console.log('Execution completed');
          } catch (e) {
            console.log('Error:', e.message);
          }
          " 2>&1 | tee extracted_strings.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-code
          path: |
            agent.js
            de4js_output.js
            extracted_strings.txt
