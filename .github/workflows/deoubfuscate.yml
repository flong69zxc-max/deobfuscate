name: Deobfuscate Frida agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install formatters
        run: npm install --no-save js-beautify prettier

      - name: Prepare output directory
        run: mkdir -p output

      - name: Beautify JavaScript
        run: |
          npx js-beautify agent.js \
            --indent-size 2 \
            --end-with-newline \
            > output/fridaagent.beautified.js

      - name: Search for suspicious operations
        run: |
          grep -Ein \
            'eval|Function|Interceptor|Java\.perform|Java\.use|Module\.find|Memory\.read|Memory\.write|send|recv|fetch|XMLHttpRequest|child_process|exec|spawn|process\.env' \
            output/fridaagent.beautified.js \
            > output/suspicious-lines.txt || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-frida-agent
          path: output/
